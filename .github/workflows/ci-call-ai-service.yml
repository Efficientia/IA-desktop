name: CI Call - AI Service Python FastAPI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  call-ai-ci:
    name: Executar CI Python FastAPI Centralizado
    uses: Efficientia/.github/.github/workflows/ci-python-fastapi.yml@main
    with:
      python-version: '3.11'
